<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turner Support Hub — Calls</title>
<style>
  :root{--rail:#0b1220;--ink:#F8FAFC;--mut:#94A3B8;--ok:#16A34A;--warn:#F59E0B;--bad:#EF4444;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--rail);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
       display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#111a30;
         border-bottom:1px solid #1e293b;flex:0 0 auto}
  header .logo{font-weight:800;letter-spacing:.3px;white-space:nowrap}
  header .lbl{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  header .sp{flex:1}
  button{border:0;border-radius:9px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}
  .b-ghost{background:#1e293b;color:var(--ink)}
  .b-red{background:var(--bad);color:#fff}
  #stage{flex:1 1 auto;position:relative;min-height:0}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        flex-direction:column;gap:14px;text-align:center;padding:24px}
  #gate .card{background:#111a30;border:1px solid #1e293b;border-radius:16px;padding:26px 30px;max-width:420px}
  #gate input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #334155;
              background:#0f172a;color:var(--ink);font-size:14px;margin:12px 0}
  #gate .go{background:var(--ok);color:#fff;width:100%}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111a30;
         border:1px solid #334155;color:var(--ink);padding:10px 16px;border-radius:12px;
         opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;z-index:50}
  #toast.on{opacity:1}
  .tiny{color:var(--mut);font-size:11.5px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="logo">📞 Turner Support Hub</span>
  <span class="lbl" id="lbl">Connecting…</span>
  <span class="sp"></span>
  <button class="b-ghost" id="guestBtn" style="display:none">🔗 Copy guest link</button>
  <button class="b-red" id="leaveBtn" style="display:none">Leave</button>
</header>
<div id="stage">
  <div id="gate"><div class="card" id="gateCard">
    <div style="font-size:30px">📞</div>
    <div id="gateMsg" style="margin-top:8px">Setting up your call…</div>
  </div></div>
</div>
<div id="toast"></div>
<script>
(function(){
  'use strict';
  var S={exec:'',me:'',callId:'',provider:'',guestSig:'',hbT:null,api:null,left:false};
  function E(id){return document.getElementById(id);}
  function toast(m){var t=E('toast');t.textContent=m;t.classList.add('on');
    clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('on');},4200);}
  function gate(msg,html){E('gate').style.display='flex';
    E('gateMsg').innerHTML=msg+(html||'');}
  function gateOff(){E('gate').style.display='none';}
  function b64d(s){try{return JSON.parse(decodeURIComponent(escape(atob(
    String(s).replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return null;}}
  function api(params,cb){
    var q=Object.keys(params).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
    fetch(S.exec+(S.exec.indexOf('?')>-1?'&':'?')+q,{method:'GET'})
      .then(function(r){return r.json();})
      .then(function(j){cb(j||{success:false,message:'Empty reply.'});})
      .catch(function(){cb({success:false,message:'Could not reach the hub backend.'});});}

  /* ── deviceId — same idea JaaS uses for MAU: sticky localStorage token ── */
  function deviceId(){try{var k='hubCallDev',v=localStorage.getItem(k);
    if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v);}
    return v;}catch(e){return 'nodev';}}

  /* ── embeds ── */
  function embedJaas(j){
    var s=document.createElement('script');
    s.src='https://8x8.vc/'+encodeURIComponent(j.appId)+'/external_api.js';
    s.onload=function(){
      var tb=['microphone','camera','desktop','chat','raisehand','tileview',
              'participants-pane','settings','hangup','fullscreen','select-background'];
      if(!j.canShare)tb=tb.filter(function(x){return x!=='desktop';});
      try{
        S.api=new JitsiMeetExternalAPI('8x8.vc',{
          roomName:j.appId+'/'+j.room, jwt:j.jwt, parentNode:E('stage'),
          userInfo:{displayName:S.me||'Guest'},
          configOverwrite:{prejoinConfig:{enabled:false},startWithVideoMuted:true,
            toolbarButtons:tb,disableDeepLinking:true},
          interfaceConfigOverwrite:{TOOLBAR_BUTTONS:tb,SHOW_JITSI_WATERMARK:false},
        });
        S.api.addListener('readyToClose',function(){leave(true);});
        gateOff();wire();
      }catch(e){gate('The call component failed to load — refresh to retry.');}
    };
    s.onerror=function(){gate('Could not load the call engine (8x8.vc blocked?) — try a normal browser.');};
    document.head.appendChild(s);}
  function embedDaily(j){
    var f=document.createElement('iframe');
    f.src=j.url;
    f.allow='camera; microphone; display-capture; autoplay; clipboard-write; fullscreen';
    E('stage').appendChild(f);gateOff();wire();}
  function embed(res){
    S.callId=res.callId;S.provider=res.provider;
    var j=res.join||{};
    E('lbl').textContent=(res.label||'Call')+' · '+(res.provider==='jaas'?'HD':'Std');
    if(j.provider==='jaas'&&j.jwt)embedJaas(j);
    else if(j.provider==='daily'&&j.url)embedDaily(j);
    else gate('No join credentials came back — close this window and try the call again.');
    startHb();}

  /* ── heartbeats + leave ── */
  function startHb(){if(S.hbT)return;
    S.hbT=setInterval(function(){
      api({callapi:'hb',call:S.callId,name:S.me||'Guest',
           key:S.guestSig?('guest:'+deviceId()):('roster:'+(S.me||'').toLowerCase())},
        function(){});
    },60000);}
  function leave(silent){if(S.left)return;S.left=true;
    try{if(S.api)S.api.dispose();}catch(e){}
    try{api({callapi:'leave',call:S.callId,name:S.me||'Guest'},function(){});}catch(e){}
    if(S.hbT){clearInterval(S.hbT);S.hbT=null;}
    if(!silent)toast('You left the call — you can close this window.');
    gate('📞 Call ended — you can close this window.');
    E('leaveBtn').style.display='none';E('guestBtn').style.display='none';}
  function wire(){
    E('leaveBtn').style.display='';
    E('leaveBtn').onclick=function(){leave(false);};
    window.addEventListener('pagehide',function(){leave(true);});}

  /* ── guest link button (roster users only) ── */
  function wireGuestBtn(res){
    if(S.guestSig||!res.guestOk&&res.guestOk!==undefined)return;
    var b=E('guestBtn');b.style.display='';
    b.onclick=function(){
      api({callapi:'guestlink',call:S.callId,name:S.me},function(r){
        if(!r.success){toast(r.message||'Guest links are unavailable.');return;}
        var done=function(){toast('🔗 Guest link copied — anyone with it can join this call.');};
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(r.link).then(done,function(){prompt('Copy this link:',r.link);});
        else prompt('Copy this link:',r.link);
      });};}

  /* ── boot ── */
  function bootRoster(pay){
    S.exec=String(pay.exec||'');S.me=String(pay.me||'');
    var it=pay.intent||{};
    if(!S.exec||!S.me){gate('This window was opened without its setup payload — start the call from the hub.');return;}
    if(it.t==='new'){
      gate('📞 Ringing…');
      api({callapi:'start',name:S.me,ppl:JSON.stringify(it.ppl||[]),
           label:it.label||'Voice call',tid:it.tid||''},function(r){
        if(!r.success){gate((r.message||'The call could not start.')+
          '<div class="tiny" style="margin-top:8px">Close this window and try again from the hub.</div>');return;}
        embed(r);wireGuestBtn(r);});
    } else if(it.t==='accept'){
      gate('📞 Joining…');
      api({callapi:'join',name:S.me,call:it.id||''},function(r){
        if(!r.success){gate(r.message||'That call has ended.');return;}
        embed(r);wireGuestBtn(r);});
    } else gate('Unknown call action — start again from the hub.');}
  function bootGuest(pay){
    S.exec=String(pay.exec||'');S.guestSig=String(pay.sig||'');
    var callId=String(pay.call||'');
    if(!S.exec||!callId||!S.guestSig){gate('This guest link is incomplete — ask for a fresh one.');return;}
    /* V19 — roster members arrive with their name preset (nm + rk): join straight in, no prompt */
    if(pay.rk&&pay.nm){S.me=String(pay.nm);gate('📞 Joining…');
      api({callapi:'join',name:S.me,call:callId,sig:S.guestSig,rk:'1'},function(r){
        if(!r.success){gate(r.message||'That call has ended.');return;}
        embed(r);wireGuestBtn(r);});return;}
    E('gateCard').innerHTML='<div style="font-size:30px">👋</div>'+
      '<div style="margin-top:6px;font-weight:800">Joining: '+(pay.label?String(pay.label).replace(/[<>&]/g,''):'Support call')+'</div>'+
      '<div class="tiny" style="margin-top:4px">Enter your name so the team knows who joined.</div>'+
      '<input id="gName" maxlength="40" placeholder="Your name">'+
      '<button class="go" id="gGo">Join the call</button>';
    E('gGo').onclick=function(){
      var nm=(E('gName').value||'').trim();
      if(!nm){toast('Please enter your name.');return;}
      S.me=nm;E('gateCard').innerHTML='📞 Joining…';
      api({callapi:'join',name:nm,call:callId,sig:S.guestSig},function(r){
        if(!r.success){gate(r.message||'That call has ended.');return;}
        embed(r);});};}
  var h=location.hash||'';
  if(h.indexOf('#x=')===0){var p1=b64d(h.slice(3));if(p1)bootRoster(p1);else gate('Bad launch payload.');}
  else if(h.indexOf('#g=')===0){var p2=b64d(h.slice(3));if(p2)bootGuest(p2);else gate('Bad guest link.');}
  else gate('Open calls from the hub — this window needs the hub\u2019s launch payload.');
})();
</script>
</body>
</html>
